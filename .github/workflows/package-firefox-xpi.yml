name: Package Firefox SPX Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "extension-firefox/**"
      - ".github/workflows/package-firefox-xpi.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("extension-firefox")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["manifest_version"] == 2
          assert manifest["browser_specific_settings"]["gecko"]["id"] == "spx-bridge-badoc-hub@nol3-hubs.github.io"
          for name in manifest["background"]["scripts"]:
              assert (root / name).is_file(), name
          for name in manifest["web_accessible_resources"]:
              assert (root / name).is_file(), name
          for name in manifest["icons"].values():
              assert (root / name).is_file(), name
          for name in ["pod-checker/page_bridge.js", "pod-checker/content.js"]:
              assert (root / name).is_file(), name
          print("Manifest and packaged files validated.")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("PACKAGE_VERSION=" + manifest["version"] + "\n")
          PY
          if grep -R -n --include='*.js' --include='*.json' --include='*.html' "chrome://extensions" extension-firefox; then
            echo "Chrome-only settings URL found in Firefox source."
            exit 1
          fi
      - name: Mozilla WebExtension lint
        run: npx --yes web-ext lint --source-dir extension-firefox
      - name: Create XPI
        shell: bash
        run: |
          cd extension-firefox
          zip -X -qr "$GITHUB_WORKSPACE/SPX-BRIDGE-BADOC-HUB-FIREFOX-${PACKAGE_VERSION}.xpi" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "SPX-BRIDGE-BADOC-HUB-FIREFOX-${PACKAGE_VERSION}.xpi" > "SPX-BRIDGE-BADOC-HUB-FIREFOX-${PACKAGE_VERSION}.sha256"
      - name: Publish unsigned XPI in repository
        shell: bash
        run: |
          mkdir -p downloads
          cp "SPX-BRIDGE-BADOC-HUB-FIREFOX-${PACKAGE_VERSION}.xpi" downloads/
          cp "SPX-BRIDGE-BADOC-HUB-FIREFOX-${PACKAGE_VERSION}.sha256" downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/SPX-BRIDGE-BADOC-HUB-FIREFOX-${PACKAGE_VERSION}.xpi" "downloads/SPX-BRIDGE-BADOC-HUB-FIREFOX-${PACKAGE_VERSION}.sha256"
          if ! git diff --cached --quiet; then
            git commit -m "Publish unsigned Firefox SPX Bridge ${PACKAGE_VERSION} package"
            # Another repository commit may land while the package is building.
            # Rebase the generated release-assets commit onto the latest branch
            # before pushing so a fast dashboard update cannot discard the XPI.
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not publish Firefox package after 3 push attempts."
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPX-BRIDGE-BADOC-HUB-FIREFOX-${{ env.PACKAGE_VERSION }}
          path: |
            SPX-BRIDGE-BADOC-HUB-FIREFOX-*.xpi
            SPX-BRIDGE-BADOC-HUB-FIREFOX-*.sha256
          if-no-files-found: error
          retention-days: 30
