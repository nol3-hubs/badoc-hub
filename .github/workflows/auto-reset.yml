name: Badoc Hub cloud save + 12 AM reset (Manila)

on:
  schedule:
    # Primary attempt at 11:30 PM Manila. Additional attempts every 30 minutes
    # through 2:30 AM recover from GitHub's delayed or missed scheduled runs.
    - cron: '30 15 * * *'
    - cron: '0,30 16-18 * * *'
  # Allows an independent external Manila-time scheduler to trigger the same
  # guarded reset through the GitHub repository_dispatch API.
  repository_dispatch:
    types: [badoc-midnight-reset]
  workflow_dispatch:       # Manual runs remain preflight-only; they never reset.

permissions:
  contents: read

concurrency:
  group: badoc-hub-github-cloud-reset
  cancel-in-progress: false

jobs:
  cloud-save-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Refresh shared cloud, save Daily History, then reset
        run: node tools/auto-reset.mjs
        env:
          APP_URL: ${{ vars.APP_URL || 'https://nol3-hubs.github.io/badoc-hub/' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
