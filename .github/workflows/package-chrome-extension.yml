name: Package Chrome SPX Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "extension/**"
      - ".github/workflows/package-chrome-extension.yml"

concurrency:
  group: badoc-chrome-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("extension")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["manifest_version"] == 3
          service_worker = manifest["background"].get("service_worker")
          assert service_worker and (root / service_worker).is_file(), service_worker
          for script in manifest["content_scripts"]:
              for name in script["js"]:
                  assert (root / name).is_file(), name
          for resource in manifest.get("web_accessible_resources", []):
              for name in resource["resources"]:
                  assert (root / name).is_file(), name
          for name in manifest["icons"].values():
              assert (root / name).is_file(), name
          print("Chrome manifest and packaged files validated.")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("PACKAGE_VERSION=" + manifest["version"] + "\n")
          PY
      - name: Create ZIP
        shell: bash
        run: |
          cd extension
          zip -X -qr "$GITHUB_WORKSPACE/SPX-BRIDGE-BADOC-HUB-CHROME-${PACKAGE_VERSION}.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "SPX-BRIDGE-BADOC-HUB-CHROME-${PACKAGE_VERSION}.zip" > "SPX-BRIDGE-BADOC-HUB-CHROME-${PACKAGE_VERSION}.sha256"
      - name: Refresh embedded Chrome bridge in dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path

          root = Path("extension")
          files = {
              path.relative_to(root).as_posix(): base64.b64encode(path.read_bytes()).decode("ascii")
              for path in sorted(root.rglob("*"))
              if path.is_file()
          }
          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          assignment = "window.BADOC_BRIDGE_FILES=" + json.dumps(files, separators=(",", ":")) + ";"
          pattern = re.compile(r"window\.BADOC_BRIDGE_FILES\s*=\s*\{.*?\}\s*;", re.DOTALL)
          updated, count = pattern.subn(lambda _match: assignment, html, count=1)
          if count != 1:
              raise SystemExit(f"Expected one embedded bridge file map in index.html; found {count}.")
          # Keep the dashboard's minimum Chrome package version synchronized
          # with the exact extension package embedded above.
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          chrome_version = manifest["version"]
          required_pattern = re.compile(r'(const\s+REQUIRED_CHROME_VERSION\s*=\s*["\'])[^"\']+(["\'];)')
          updated, required_count = required_pattern.subn(
              lambda match: match.group(1) + chrome_version + match.group(2),
              updated,
              count=1
          )
          if required_count != 1:
              raise SystemExit(
                  "Expected one REQUIRED_CHROME_VERSION declaration in index.html; "
                  f"found {required_count}."
              )

          settings_pattern = re.compile(
              r'(const\s+required\s*=\s*firefox\s*\?\s*["\']Firefox\s+[^"\']+["\']\s*:\s*["\']Chrome\s+)[^"\']+(["\'];)'
          )
          updated, settings_count = settings_pattern.subn(
              lambda match: match.group(1) + chrome_version + match.group(2),
              updated,
              count=1
          )
          if settings_count != 1:
              raise SystemExit(
                  "Expected one Settings-page Chrome required-version label in index.html; "
                  f"found {settings_count}."
              )





          index_path.write_text(updated, encoding="utf-8")
          print(f"Embedded {len(files)} Chrome extension files and synchronized required version {chrome_version} in index.html.")

      - name: Publish ZIP in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=0
          for attempt in 1 2 3; do
            # Start from the latest main branch and regenerate the embedded bridge there.
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p downloads
            cp -f "SPX-BRIDGE-BADOC-HUB-CHROME-${PACKAGE_VERSION}.zip" downloads/
            cp -f "SPX-BRIDGE-BADOC-HUB-CHROME-${PACKAGE_VERSION}.sha256" downloads/
            python3 - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path
          
          root = Path("extension")
          files = {
              path.relative_to(root).as_posix(): base64.b64encode(path.read_bytes()).decode("ascii")
              for path in sorted(root.rglob("*"))
              if path.is_file()
          }
          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          assignment = "window.BADOC_BRIDGE_FILES=" + json.dumps(files, separators=(",", ":")) + ";"
          pattern = re.compile(r"window\.BADOC_BRIDGE_FILES\s*=\s*\{.*?\}\s*;", re.DOTALL)
          updated, count = pattern.subn(lambda _match: assignment, html, count=1)
          if count != 1:
              raise SystemExit(f"Expected one embedded bridge file map in index.html; found {count}.")
          
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          chrome_version = manifest["version"]
          required_pattern = re.compile(r'(const\s+REQUIRED_CHROME_VERSION\s*=\s*["\'])[^"\']+(["\'];)')
          updated, required_count = required_pattern.subn(
              lambda match: match.group(1) + chrome_version + match.group(2),
              updated,
              count=1
          )
          if required_count != 1:
              raise SystemExit(f"Expected one REQUIRED_CHROME_VERSION declaration; found {required_count}.")
          
          settings_pattern = re.compile(
              r'(const\s+required\s*=\s*firefox\s*\?\s*["\']Firefox\s+[^"\']+["\']\s*:\s*["\']Chrome\s+)[^"\']+(["\'];)'
          )
          updated, settings_count = settings_pattern.subn(
              lambda match: match.group(1) + chrome_version + match.group(2),
              updated,
              count=1
          )
          if settings_count != 1:
              raise SystemExit(f"Expected one Settings-page Chrome version label; found {settings_count}.")
          # Apply the Hub Compliance fallback once. The sentinel prevents duplicate insertion on later package runs.
          score_sentinel = "BADOC_HUB_COMPLIANCE_SCORE_WEIGHT_FALLBACK_V1"
          legacy_score_remap = "\n".join([
              '        if(name==="Hub Compliance Score"){',
              '          const actualText=String(v.actual??"").trim();',
              '          const weightText=String(v.weight??"").trim();',
              '          if((!actualText || actualText==="—") && weightText){',
              '            v.actual=v.weight;',
              '            v.weight="";',
              '          }',
              '        }'
          ])
          # If the sentinel version exists, remove one older unsentinelled copy.
          if score_sentinel in updated:
              updated = updated.replace(legacy_score_remap, "", 1)
          if score_sentinel not in updated:
              card_marker = '        const v=getMetricValue(rows,block.data,block.metricHeader,name);'
              card_replacement = "\n".join([
                  '        const v=getMetricValue(rows,block.data,block.metricHeader,name);',
                  '        // BADOC_HUB_COMPLIANCE_SCORE_WEIGHT_FALLBACK_V1',
                  '        if(name==="Hub Compliance Score"){',
                  '          const actualText=String(v.actual??"").trim();',
                  '          const weightText=String(v.weight??"").trim();',
                  '          if((!actualText || actualText==="—") && weightText){',
                  '            v.actual=v.weight;',
                  '            v.weight="";',
                  '          }',
                  '        }'
              ])
              card_count = updated.count(card_marker)
              if card_count != 1:
                  raise SystemExit(f"Expected one KPI card value-rendering point in index.html; found {card_count}.")
              updated = updated.replace(card_marker, card_replacement, 1)
          # Zero is green; 0.1 and above is red for these three metrics.
          threshold_patch = "\n".join([
              '        const zeroGoodThresholdMetrics=["Hub Compliance Score","Feeder Fraud","Linehaul Arrival Points"];',
              '        if(actualNum!==null && zeroGoodThresholdMetrics.includes(name)){',
              '          if(actualNum===0) card.classList.add("kpi-status-a");',
              '          else if(actualNum>=0.1) card.classList.add("kpi-status-below-b");',
              '        }else if(actualNum!==null){'
          ])
          threshold_parts = updated.split(threshold_patch)
          if len(threshold_parts) > 1:
              updated = threshold_parts[0] + threshold_patch + "".join(threshold_parts[1:])
          else:
              color_marker = '        const meets=(actual,target)=>lowerIsBetter?actual<=target:actual>=target;' + chr(10) + '        if(actualNum!==null){'
              color_replacement = "\n".join([
                  '        const meets=(actual,target)=>lowerIsBetter?actual<=target:actual>=target;',
                  '        const zeroGoodThresholdMetrics=["Hub Compliance Score","Feeder Fraud","Linehaul Arrival Points"];',
                  '        if(actualNum!==null && zeroGoodThresholdMetrics.includes(name)){',
                  '          if(actualNum===0) card.classList.add("kpi-status-a");',
                  '          else if(actualNum>=0.1) card.classList.add("kpi-status-below-b");',
                  '        }else if(actualNum!==null){'
              ])
              color_count = updated.count(color_marker)
              if color_count != 1:
                  raise SystemExit(f"Expected one KPI threshold-coloring block in index.html; found {color_count}.")
              updated = updated.replace(color_marker, color_replacement, 1)

          index_path.write_text(updated, encoding="utf-8")
          print(f"Embedded {len(files)} Chrome files and synchronized required version {chrome_version}.")
          PY
            git add index.html "downloads/SPX-BRIDGE-BADOC-HUB-CHROME-${PACKAGE_VERSION}.zip" "downloads/SPX-BRIDGE-BADOC-HUB-CHROME-${PACKAGE_VERSION}.sha256"
            if git diff --cached --quiet; then
              echo "Chrome package files are already current."
              published=1
              break
            fi
            git commit -m "Publish Chrome SPX Bridge ${PACKAGE_VERSION} package"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              published=1
              break
            fi
            echo "Publish attempt ${attempt} raced with another branch update; refreshing and rebuilding."
            sleep 2
          done
          if [ "$published" -ne 1 ]; then
            echo "Could not publish Chrome package after 3 attempts."
            exit 1
          fi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPX-BRIDGE-BADOC-HUB-CHROME-${{ env.PACKAGE_VERSION }}
          path: |
            SPX-BRIDGE-BADOC-HUB-CHROME-*.zip
            SPX-BRIDGE-BADOC-HUB-CHROME-*.sha256
          if-no-files-found: error
          retention-days: 30
